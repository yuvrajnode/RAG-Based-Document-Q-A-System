name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Lint
        run: |
          ruff check verbatim tests
          ruff format --check verbatim tests

      - name: Test
        # The suite runs against the hashing embedder and the flat index, so
        # there is no model download and no API key in CI.
        env:
          VERBATIM_EMBEDDING_PROVIDER: hashing
          VERBATIM_VECTOR_STORE: numpy
        run: pytest -q

      - name: Retrieval regression gate
        env:
          VERBATIM_EMBEDDING_PROVIDER: hashing
          VERBATIM_VECTOR_STORE: numpy
          VERBATIM_STORAGE_DIR: ./ci-storage
        run: |
          python -m verbatim.cli ingest ./samples
          python -m verbatim.eval.run_eval eval/questions.jsonl --k 5

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: verbatim:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          docker run -d --name verbatim -p 8000:8000 \
            -e VERBATIM_EMBEDDING_PROVIDER=hashing verbatim:ci
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/api/health && break
            sleep 2
          done
          curl -sf http://localhost:8000/api/health
          docker rm -f verbatim
