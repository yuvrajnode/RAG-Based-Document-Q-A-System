[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verbatim"
version = "0.4.0"
description = "Retrieval-augmented question answering over your own documents, with sentence-level citations."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yuvraj Singh" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
    "anthropic>=0.40",
    "httpx>=0.27",
    "pypdf>=4.2",
    "python-docx>=1.1",
    "beautifulsoup4>=4.12",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
chroma = ["chromadb>=0.5"]
local-embeddings = ["sentence-transformers>=3.0"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
]

[project.scripts]
verbatim = "verbatim.cli:app"

[tool.setuptools.packages.find]
include = ["verbatim*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: FastAPI Depends() in defaults is the framework idiom.
# B905: zip() strict= would be noise on pairs we build ourselves.
ignore = ["B008", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
